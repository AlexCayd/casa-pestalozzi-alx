# Receta de etapa 6; no ejecutada. Leer README.md antes de usarla.
# Versiones exactas verificadas en releases oficiales el 2026-09-13.
name: ${COMPOSE_PROJECT_NAME:?Definir un proyecto nuevo y aislado}

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.38.7
    restart: unless-stopped
    stop_grace_period: 90s
    ports:
      - "127.0.0.1:${N8N_LOCAL_PORT:-5678}:5678"
    environment:
      NODE_ENV: production
      DB_TYPE: sqlite
      N8N_HOST: ${N8N_HOST:?Definir hostname de n8n}
      N8N_PORT: "5678"
      N8N_LISTEN_ADDRESS: "0.0.0.0"
      N8N_PROTOCOL: https
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:?Definir URL HTTPS del editor}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:?Definir base HTTPS de webhooks}
      N8N_PROXY_HOPS: "1"
      N8N_SECURE_COOKIE: "true"
      GENERIC_TIMEZONE: America/Mexico_City
      TZ: America/Mexico_City
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_ENCRYPTION_KEY_FILE: /run/secrets/n8n_encryption_key
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES: "true"
      N8N_COMMUNITY_PACKAGES_ENABLED: "false"
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: "0.0.0.0"
      N8N_RUNNERS_AUTH_TOKEN_FILE: /run/secrets/n8n_runner_auth_token
      N8N_GRACEFUL_SHUTDOWN_TIMEOUT: "60"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "24"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_LOG_LEVEL: warn
    volumes:
      - n8n_data:/home/node/.n8n
    secrets:
      - n8n_encryption_key
      - n8n_runner_auth_token
    networks:
      - egress
      - runner_internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const http = require('node:http');
          const req = http.get('http://127.0.0.1:5678/healthz/readiness',
          res => { res.resume(); process.exit(res.statusCode === 200 ? 0 : 1); });
          req.setTimeout(3000, () => { req.destroy(); process.exit(1); });
          req.on('error', () => process.exit(1));
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  task-runners:
    image: n8nio/runners:2.38.7
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    # El launcher no se presupone compatible con _FILE. Este adaptador lee
    # exclusivamente el token técnico y ejecuta el launcher oficial, sin loguearlo.
    entrypoint: ["tini", "--", "/bin/sh", "-ec"]
    command:
      - >-
        export N8N_RUNNERS_AUTH_TOKEN="$$(cat /run/secrets/n8n_runner_auth_token)";
        test -n "$$N8N_RUNNERS_AUTH_TOKEN";
        exec /usr/local/bin/task-runner-launcher javascript
    environment:
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
      N8N_RUNNERS_INSECURE_MODE: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      TZ: America/Mexico_City
    secrets:
      - n8n_runner_auth_token
    networks:
      - runner_internal
    depends_on:
      n8n:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  n8n_data:
    name: ${N8N_DATA_VOLUME:?Definir un volumen nuevo y exclusivo}

secrets:
  n8n_encryption_key:
    file: ${N8N_ENCRYPTION_KEY_PATH:?Definir archivo privado externo al repositorio}
  n8n_runner_auth_token:
    file: ${N8N_RUNNER_AUTH_TOKEN_PATH:?Definir archivo privado externo al repositorio}

networks:
  egress: {}
  runner_internal:
    internal: true
